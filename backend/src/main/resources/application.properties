# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:dummy}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:noreply@example.com}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Feature Toggles
recaptcha.enabled=${RECAPTCHA_ENABLED:false}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:dummy-key}
email.verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}

# Other
chatbot.service.url=${CHATBOT_SERVICE_URL:http://ai:8001}
stripe.secret-key=${STRIPE_SECRET_KEY:dummy-key}
crypto.merchant.wallet=${CRYPTO_MERCHANT_WALLET:0x0000000000000000000000000000000000000000}
storage.local.upload-dir=${STORAGE_LOCAL_UPLOAD_DIR:/app/uploads}

logging.level.org.springframework.security=DEBUG
