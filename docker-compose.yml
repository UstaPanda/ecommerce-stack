services:
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - ai

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ecommerce_analytics}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    # No ports exposed to public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # No ports exposed to public
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-ecommerce_analytics}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-yahwvg2vqvz33035x26+vmQ9PzfRwdE/EneUx0SHsT4=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      CHATBOT_SERVICE_URL: http://ai:8001
      APP_BASE_URL: http://localhost

      # Flyway Fix for pre-existing DB
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "7"

      # Feature Toggles (Set to false for easier initial setup)
      RECAPTCHA_ENABLED: "false"
      EMAIL_VERIFICATION_ENABLED: "false"

      # Mandatory Keys (Dummy values allowed if features disabled)
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-dummy_key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-dummy_key}
      CRYPTO_MERCHANT_WALLET: ${CRYPTO_MERCHANT_WALLET:-0x0000000000000000000000000000000000000000}
      STORAGE_LOCAL_UPLOAD_DIR: ${STORAGE_LOCAL_UPLOAD_DIR:-/app/uploads}

      # Mail Settings
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${MAIL_FROM:-DataPulse <noreply@example.com>}

      # Google OAuth2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-dummy-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-dummy-secret}
    volumes:
      - ./backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  ai:
    build: ./ai
    restart: always
    # No ports exposed to public
    environment:
      DB_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ecommerce_analytics}
      JWT_SECRET: ${JWT_SECRET:-yahwvg2vqvz33035x26+vmQ9PzfRwdE/EneUx0SHsT4=}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      PORT: 8001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # No ports exposed to public
    environment:
      - ANGULAR_ALLOWED_HOSTS=localhost,backend,ai,frontend,gateway,127.0.0.1,192.168.189.139
    depends_on:
      - backend
      - ai
