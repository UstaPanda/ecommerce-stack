services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: ecommerce_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Asd180Qwe123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-analytics:
    build: .
    container_name: indigo-vault-ai
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - DB_URL=postgresql://postgres:Asd180Qwe123@postgres:5432/ecommerce_analytics
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-ui:
    build: .
    container_name: indigo-vault-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_URL=postgresql://postgres:Asd180Qwe123@postgres:5432/ecommerce_analytics
    command: ["chainlit", "run", "app.py", "--host", "0.0.0.0", "--port", "8501"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
